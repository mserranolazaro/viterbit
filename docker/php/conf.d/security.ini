; The app accepts no file uploads (the CV is pasted as text), so the upload and
; multipart surface is closed. It is also an interim mitigation for CVE-2026-109618
; and CVE-2026-109619 (see docs/DECISIONS.md, ADR-004); upgrading PHP is the real fix.
file_uploads = Off
max_file_uploads = 0
post_max_size = 1M
session.upload_progress.enabled = 0
expose_php = Off

; PHP's own warnings never go into the response body (they broke the headers of an oversized
; POST and leak paths). Symfony renders errors itself; PHP only logs.
display_errors = Off
display_startup_errors = Off
log_errors = On
