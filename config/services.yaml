# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # The domain holds entities, value objects, events and ports: nothing to wire.
            - '../src/*/Domain/'

    # Ports → adapters. The domain is excluded above, so each port is bound here, in one place.
    App\SharedKernel\Domain\Event\DomainEventPublisher: '@App\SharedKernel\Infrastructure\Messaging\MessengerDomainEventPublisher'
    App\Recruitment\Domain\Write\Repository\PositionRepository: '@App\Recruitment\Infrastructure\Persistence\Mongo\MongoPositionRepository'
    App\Recruitment\Domain\Write\Repository\JobApplicationRepository: '@App\Recruitment\Infrastructure\Persistence\Mongo\MongoJobApplicationRepository'
    App\Recruitment\Domain\Read\JobApplicationViewRepository: '@App\Recruitment\Infrastructure\Persistence\Mongo\MongoJobApplicationViewRepository'
    App\Recruitment\Domain\Write\Service\CvAnalyzer: '@App\Recruitment\Infrastructure\Ai\PromptBasedCvAnalyzer'
    # Swap for a real provider's client to use an actual LLM; nothing else changes.
    App\Recruitment\Infrastructure\Ai\LlmClient: '@App\Recruitment\Infrastructure\Ai\SimulatedLlmClient'

    MongoDB\Client:
        arguments:
            - '%env(MONGODB_URL)%'
            - []
            # Documents come back as plain PHP arrays, which the repositories map explicitly.
            - { typeMap: { root: array, document: array, array: array } }

    MongoDB\Database:
        factory: ['@MongoDB\Client', 'getDatabase']
        arguments: ['%env(MONGODB_DB)%']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
