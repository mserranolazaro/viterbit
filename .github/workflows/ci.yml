name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same path a reviewer follows: one command builds and starts everything.
      - name: make init
        run: make init

      - name: PHP security baseline (ADR-004)
        run: make security

      - name: Code quality
        run: make qa

      - name: Tests with coverage (fails under 90 % of lines or methods)
        run: make coverage

      - name: Acceptance tests (real Chrome against the running stack)
        run: make acceptance
